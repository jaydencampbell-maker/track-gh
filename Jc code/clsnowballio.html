<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#11120f">
    <title>Snowball.io | VELOCITY</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/paigerodeghero/academicwebsite@897c910c65e6c68b04c44a6b6eba0b99d0f2f2cf/TemplateData/style.css">
    <style>
        html,
        body {
            width: 100%;
            height: 100%;
            margin: 0;
            overflow: hidden;
            background: #11120f;
        }

        .webgl-content,
        #gameContainer {
            width: 100vw !important;
            height: 100vh !important;
            padding: 0 !important;
            margin: 0 !important;
            border: 0 !important;
        }

        #gameContainer canvas {
            width: 100% !important;
            height: 100% !important;
        }

        #velocity-return,
        #game-error {
            position: fixed;
            z-index: 20;
            top: 12px;
            left: 12px;
            padding: 9px 13px;
            color: #f3f2ec;
            background: rgba(17, 18, 15, 0.9);
            border: 1px solid rgba(242, 243, 232, 0.4);
            border-radius: 4px;
            font: 700 13px/1.4 "Segoe UI", Arial, sans-serif;
        }

        #velocity-return {
            text-decoration: none;
        }

        #velocity-return:hover,
        #velocity-return:focus-visible {
            color: #11120f;
            background: #c5f36b;
        }

        #game-error {
            top: 62px;
            max-width: min(560px, calc(100vw - 50px));
            color: #ffb8a5;
        }
    </style>
</head>
<body>
    <a id="velocity-return" href="arcade.html">← Back to game library</a>
    <p id="game-error" role="alert" hidden></p>
    <div class="webgl-content">
        <div id="gameContainer">
            <canvas id="canvas" aria-label="Snowball.io game"></canvas>
        </div>
    </div>
    <script>
        (() => {
            const gameBase = "https://cdn.jsdelivr.net/gh/gertdoro/SQLite4Unity3d@eda39654f6ca782386c5d8c43677a36873fc1319/Example/Assets/js/";
            const errorElement = document.getElementById("game-error");
            let gameInstance;

            function showError(message) {
                errorElement.textContent = message;
                errorElement.hidden = false;
            }

            function loadScript(source) {
                return new Promise((resolve, reject) => {
                    const script = document.createElement("script");
                    script.src = source;
                    script.onload = resolve;
                    script.onerror = () => reject(new Error(`Could not load game file: ${source}`));
                    document.head.appendChild(script);
                });
            }

            async function startGame() {
                try {
                    await loadScript("https://cdn.jsdelivr.net/gh/lee2sman/everyday@d45d601d2c4d60adf809a0b677c00b7d12aba7e9/96/TemplateData/UnityProgress.js");
                    await loadScript(`${gameBase}sb.js`);

                    if (typeof window.UnityLoader?.instantiate !== "function" || typeof window.UnityProgress !== "function") {
                        throw new Error("The Unity game loader is unavailable.");
                    }

                    gameInstance = window.UnityLoader.instantiate(
                        "gameContainer",
                        `${gameBase}sb.json`,
                        {
                            onProgress: window.UnityProgress,
                            Module: {
                                onRuntimeInitialized: () => window.UnityProgress(gameInstance, "complete")
                            }
                        }
                    );
                } catch (error) {
                    console.error("Could not start Snowball.io:", error);
                    showError(`Snowball.io could not load: ${error.message}`);
                }
            }

            startGame();
        })();
    </script>
</body>
</html>
