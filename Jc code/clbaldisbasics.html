<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#11120f">
    <title>Baldi’s Basics | VELOCITY</title>
    <style>
        html,
        body {
            width: 100%;
            height: 100%;
            margin: 0;
            overflow: hidden;
            background: #11120f;
        }

        .webgl-content,
        #unityContainer,
        #gameContainer {
            width: 100vw;
            height: 100vh;
            margin: 0;
            padding: 0;
            border: 0;
        }

        #unityContainer {
            position: absolute;
            inset: 0;
            background: #232020;
        }

        #gameContainer {
            position: relative;
        }

        #gameContainer canvas {
            width: 100% !important;
            height: 100% !important;
        }

        #velocity-return,
        #game-error {
            position: fixed;
            z-index: 20;
            top: 12px;
            left: 12px;
            padding: 9px 13px;
            color: #f3f2ec;
            background: rgba(17, 18, 15, 0.9);
            border: 1px solid rgba(242, 243, 232, 0.4);
            border-radius: 4px;
            font: 700 13px/1.4 "Segoe UI", Arial, sans-serif;
        }

        #velocity-return {
            text-decoration: none;
        }

        #velocity-return:hover,
        #velocity-return:focus-visible {
            color: #11120f;
            background: #c5f36b;
        }

        #game-error {
            top: 62px;
            max-width: min(560px, calc(100vw - 50px));
            color: #ffb8a5;
        }

        #file-merger-loading {
            z-index: 10 !important;
        }
    </style>
</head>
<body>
    <a id="velocity-return" href="arcade.html">← Back to game library</a>
    <p id="game-error" role="alert" hidden></p>
    <div class="webgl-content">
        <div id="unityContainer">
            <div id="gameContainer"></div>
        </div>
    </div>
    <script>
        (() => {
            const gameBase = "https://raw.githubusercontent.com/bubbls/UGS-Assets/main/baldis-basics/";
            const errorElement = document.getElementById("game-error");
            let gameInstance;

            function showError(message) {
                errorElement.textContent = message;
                errorElement.hidden = false;
            }

            function loadScript(source) {
                return new Promise((resolve, reject) => {
                    fetch(source)
                        .then((response) => {
                            if (!response.ok) {
                                throw new Error(`Could not load game file (HTTP ${response.status}): ${source}`);
                            }
                            return response.text();
                        })
                        .then((code) => {
                            const scriptUrl = URL.createObjectURL(new Blob([code], { type: "text/javascript" }));
                            const script = document.createElement("script");
                            script.src = scriptUrl;
                            script.onload = () => {
                                URL.revokeObjectURL(scriptUrl);
                                resolve();
                            };
                            script.onerror = () => {
                                URL.revokeObjectURL(scriptUrl);
                                reject(new Error(`Could not execute game file: ${source}`));
                            };
                            document.head.appendChild(script);
                        })
                        .catch(reject);
                });
            }

            async function startGame() {
                window.fileMergerConfig = {
                    files: [
                        { name: "baldi.data.unityweb", parts: 2 },
                        { name: "baldi.wasm.code.unityweb", parts: 1 },
                        { name: "baldi.wasm.framework.unityweb", parts: 1 }
                    ],
                    basePath: `${gameBase}unity/`,
                    debug: false
                };

                try {
                    await loadScript("https://raw.githubusercontent.com/bubbls/UGS-Assets/main/merge.js");
                    await loadScript(`${gameBase}TemplateData/UnityProgress.js`);
                    await loadScript(`${gameBase}baldi.js`);

                    if (typeof window.UnityLoader?.instantiate !== "function" || typeof window.UnityProgress !== "function") {
                        throw new Error("The Unity game loader is unavailable.");
                    }

                    gameInstance = window.UnityLoader.instantiate(
                        "gameContainer",
                        `${gameBase}baldi.json`,
                        {
                            onProgress: window.UnityProgress,
                            Module: {
                                onRuntimeInitialized: () => window.UnityProgress(gameInstance, "complete")
                            }
                        }
                    );
                } catch (error) {
                    console.error("Could not start Baldi’s Basics:", error);
                    showError(`Baldi’s Basics could not load: ${error.message}`);
                }
            }

            startGame();
        })();
    </script>
</body>
</html>
