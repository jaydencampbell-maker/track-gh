<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#11120f">
    <title>Slope Plus | VELOCITY</title>
    <style>
        html,
        body {
            width: 100%;
            height: 100%;
            margin: 0;
            overflow: hidden;
            background: #000;
        }

        .webgl-content,
        #gameContainer {
            width: 100vw !important;
            height: 100vh !important;
            margin: 0 !important;
            padding: 0 !important;
        }

        #gameContainer .logo {
            position: fixed;
            top: 50%;
            left: 50%;
            width: 154px;
            height: 130px;
            background: url("https://raw.githubusercontent.com/gn-math/assets/main/198/TemplateData/progressLogo.Dark.png") no-repeat center;
            transform: translate(-50%, -50%);
        }

        #gameContainer .progress {
            position: fixed;
            top: calc(50% + 80px);
            left: 50%;
            width: 141px;
            height: 18px;
            transform: translateX(-50%);
        }

        #gameContainer .progress .empty,
        #gameContainer .progress .full {
            position: absolute;
            top: 0;
            height: 18px;
        }

        #gameContainer .progress .empty {
            right: 0;
            width: 100%;
            background: url("https://raw.githubusercontent.com/gn-math/assets/main/198/TemplateData/progressEmpty.Dark.png") no-repeat right;
        }

        #gameContainer .progress .full {
            left: 0;
            width: 0;
            background: url("https://raw.githubusercontent.com/gn-math/assets/main/198/TemplateData/progressFull.Dark.png") no-repeat left;
        }

        #velocity-return,
        #game-error {
            position: fixed;
            z-index: 20;
            top: 12px;
            left: 12px;
            padding: 9px 13px;
            color: #f3f2ec;
            background: rgba(17, 18, 15, 0.9);
            border: 1px solid rgba(242, 243, 232, 0.4);
            border-radius: 4px;
            font: 700 13px/1.4 "Segoe UI", Arial, sans-serif;
        }

        #velocity-return {
            text-decoration: none;
        }

        #velocity-return:hover,
        #velocity-return:focus-visible {
            color: #11120f;
            background: #c5f36b;
        }

        #game-error {
            top: 62px;
            max-width: min(560px, calc(100vw - 50px));
            color: #ffb8a5;
        }
    </style>
</head>
<body>
    <a id="velocity-return" href="arcade.html">← Back to game library</a>
    <p id="game-error" role="alert" hidden></p>
    <div class="webgl-content">
        <div id="gameContainer"></div>
    </div>
    <script>
        (() => {
            const assetBase = "https://raw.githubusercontent.com/gn-math/assets/main/198/";
            const errorElement = document.getElementById("game-error");
            let gameInstance;

            function showError(message) {
                errorElement.textContent = message;
                errorElement.hidden = false;
            }

            function loadScript(source) {
                return new Promise((resolve, reject) => {
                    fetch(source)
                        .then((response) => {
                            if (!response.ok) {
                                throw new Error(`Could not load game file (HTTP ${response.status}): ${source}`);
                            }
                            return response.text();
                        })
                        .then((code) => {
                            const scriptUrl = URL.createObjectURL(new Blob([code], { type: "text/javascript" }));
                            const script = document.createElement("script");
                            script.src = scriptUrl;
                            script.onload = () => {
                                URL.revokeObjectURL(scriptUrl);
                                resolve();
                            };
                            script.onerror = () => {
                                URL.revokeObjectURL(scriptUrl);
                                reject(new Error(`Could not execute game file: ${source}`));
                            };
                            document.head.appendChild(script);
                        })
                        .catch(reject);
                });
            }

            async function mergeParts(file, partCount) {
                const parts = await Promise.all(
                    Array.from({ length: partCount }, async (_, index) => {
                        const response = await fetch(`${assetBase}${file}.part${index + 1}`);
                        if (!response.ok) {
                            throw new Error(`Could not load ${file} part ${index + 1} (HTTP ${response.status}).`);
                        }
                        return response.arrayBuffer();
                    })
                );
                return URL.createObjectURL(new Blob(parts, { type: "application/octet-stream" }));
            }

            async function startGame() {
                try {
                    await Promise.all([
                        loadScript(`${assetBase}TemplateData/UnityProgress.js`),
                        loadScript(`${assetBase}Build/UnityLoader.js`)
                    ]);

                    if (typeof window.UnityLoader?.instantiate !== "function" || typeof window.UnityProgress !== "function") {
                        throw new Error("The Unity game loader is unavailable.");
                    }

                    const dataUrl = await mergeParts("Build/WEB1.2.1.data.unityweb", 2);
                    const config = {
                        companyName: "Slope Plus",
                        productName: "Slope Plus",
                        dataUrl,
                        wasmCodeUrl: `${assetBase}Build/WEB1.2.1.wasm.code.unityweb`,
                        wasmFrameworkUrl: `${assetBase}Build/WEB1.2.1.wasm.framework.unityweb`,
                        TOTAL_MEMORY: 268435456,
                        graphicsAPI: ["WebGL 2.0", "WebGL 1.0"],
                        webglContextAttributes: { preserveDrawingBuffer: false },
                        splashScreenStyle: "Dark",
                        backgroundColor: "#000000"
                    };
                    const configUrl = URL.createObjectURL(new Blob([JSON.stringify(config)], { type: "application/json" }));

                    gameInstance = window.UnityLoader.instantiate("gameContainer", config, {
                        onProgress: window.UnityProgress,
                        url: configUrl
                    });
                } catch (error) {
                    console.error("Could not start Slope Plus:", error);
                    showError(`Slope Plus could not load: ${error.message}`);
                }
            }

            window.addEventListener("resize", () => {
                const container = document.getElementById("gameContainer");
                if (container) {
                    container.style.width = `${window.innerWidth}px`;
                    container.style.height = `${window.innerHeight}px`;
                }
            });

            startGame();
        })();
    </script>
</body>
</html>
