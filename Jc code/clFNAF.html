<!doctype html>
<html lang="en">
<head>
    <base href="https://cdn.jsdelivr.net/gh/bubblfan/fnaf@latest/1/">
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black">
    <meta name="theme-color" content="#1d1d1d">
    <title>Five Nights at Freddy’s | VELOCITY</title>
    <link rel="stylesheet" href="style.css">
    <style>
        html,
        body {
            width: 100%;
            height: 100%;
            margin: 0;
            overflow: hidden;
            background: #1d1d1d;
        }

        body {
            display: grid;
            place-items: center;
        }

        #MMFCanvas {
            display: block;
            width: min(100vw, 177.78vh);
            height: min(56.25vw, 100vh);
            max-width: 100vw;
            max-height: 100vh;
        }

        #progress-container {
            box-sizing: border-box;
            width: min(312px, calc(100vw - 32px));
        }

        #velocity-return,
        #game-error {
            position: fixed;
            z-index: 10001;
            top: 12px;
            left: 12px;
            padding: 9px 13px;
            color: #f3f2ec;
            background: rgba(17, 18, 15, 0.9);
            border: 1px solid rgba(242, 243, 232, 0.4);
            border-radius: 4px;
            font: 700 13px/1.4 "Segoe UI", Arial, sans-serif;
        }

        #velocity-return {
            text-decoration: none;
        }

        #velocity-return:hover,
        #velocity-return:focus-visible {
            color: #11120f;
            background: #c5f36b;
        }

        #game-error {
            top: auto;
            bottom: 12px;
            max-width: min(560px, calc(100vw - 50px));
            color: #ffb8a5;
        }
    </style>
</head>
<body>
    <a id="velocity-return" href="arcade.html">← Back to game library</a>
    <p id="game-error" role="alert" hidden></p>
    <canvas id="MMFCanvas" width="1280" height="720">
        Your browser does not support Canvas. Please try again.
    </canvas>
    <div id="progress-container">
        <div style="margin-bottom: 6px">
            Downloading... <span id="download-text">0%</span>
        </div>
        <div style="width: 100%; background: #444; border-radius: 6px; overflow: hidden">
            <div id="download-bar" style="height: 10px; background: #3b82f6; width: 0%; transition: width 0.2s"></div>
        </div>
        <div style="margin: 12px 0 6px">
            Extracting... <span id="extract-text">0%</span>
        </div>
        <div style="width: 100%; background: #444; border-radius: 6px; overflow: hidden">
            <div id="extract-bar" style="height: 10px; background: #10b981; width: 0%; transition: width 0.2s"></div>
        </div>
    </div>
    <script>
        document.getElementById("velocity-return").href = new URL("arcade.html", window.location.href).href;
        window.addEventListener("error", (event) => {
            const errorElement = document.getElementById("game-error");
            errorElement.textContent = `Five Nights at Freddy’s could not load: ${event.message || "a game resource failed"}`;
            errorElement.hidden = false;
        });
        window.addEventListener("unhandledrejection", (event) => {
            const errorElement = document.getElementById("game-error");
            const detail = event.reason instanceof Error ? event.reason.message : String(event.reason);
            errorElement.textContent = `Five Nights at Freddy’s could not load: ${detail}`;
            errorElement.hidden = false;
        });
    </script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
    <script src="main.js"></script>
</body>
</html>
