<!doctype html>
<html lang="en">
<head>
    <base href="https://cdn.jsdelivr.net/gh/bubbls/subwaysurfersmerge/">
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#11120f">
    <title>Subway Surfers: Beijing | VELOCITY</title>
    <style>
        html,
        body {
            width: 100%;
            height: 100%;
            margin: 0;
            overflow: hidden;
            background: #11120f;
        }

        #velocity-return,
        #game-error {
            position: fixed;
            z-index: 9999;
            top: 12px;
            left: 12px;
            padding: 9px 13px;
            color: #f3f2ec;
            background: rgba(17, 18, 15, 0.9);
            border: 1px solid rgba(242, 243, 232, 0.4);
            border-radius: 4px;
            font: 700 13px/1.4 "Segoe UI", Arial, sans-serif;
        }

        #velocity-return {
            text-decoration: none;
        }

        #velocity-return:hover,
        #velocity-return:focus-visible {
            color: #11120f;
            background: #c5f36b;
        }

        #game-error {
            top: 62px;
            max-width: min(560px, calc(100vw - 50px));
            color: #ffb8a5;
        }

        #gameContainer,
        #gameContainer canvas {
            width: 100vw !important;
            height: 100vh !important;
        }

        #gameContainer {
            position: fixed;
            inset: 0;
        }
    </style>
</head>
<body>
    <a id="velocity-return" href="arcade.html">← Back to game library</a>
    <p id="game-error" role="alert" hidden></p>
    <script>
        (() => {
            const gameBase = "https://cdn.jsdelivr.net/gh/bubbls/subwaysurfersmerge/";
            const errorElement = document.getElementById("game-error");
            const mergedBlobUrls = Object.create(null);
            let assetsReady = false;

            function showError(message) {
                errorElement.textContent = message;
                errorElement.hidden = false;
            }

            function loadScript(source) {
                    return new Promise((resolve, reject) => {
                        const script = document.createElement("script");
                        script.src = source;
                        script.onload = resolve;
                        script.onerror = () => reject(new Error(`Could not load game script: ${source}`));
                        document.head.appendChild(script);
                    });
            }

            async function mergeSplitFile(filename, partCount) {
                const parts = await Promise.all(
                    Array.from({ length: partCount }, async (_, index) => {
                        const response = await fetch(`${gameBase}${filename}.part${index + 1}`);
                        if (!response.ok) {
                            throw new Error(`Could not load ${filename} part ${index + 1} (HTTP ${response.status}).`);
                        }
                        return response.arrayBuffer();
                    })
                );
                mergedBlobUrls[filename] = URL.createObjectURL(
                    new Blob(parts, { type: "application/octet-stream" })
                );
            }

            function installAssetInterceptors() {
                const originalOpen = XMLHttpRequest.prototype.open;
                const originalSend = XMLHttpRequest.prototype.send;

                XMLHttpRequest.prototype.open = function (method, url, ...args) {
                    let finalUrl = url;
                    if (assetsReady) {
                        for (const [filename, blobUrl] of Object.entries(mergedBlobUrls)) {
                            if (String(url).includes(filename)) {
                                finalUrl = blobUrl;
                                break;
                            }
                        }
                    }
                    return originalOpen.call(this, method, finalUrl, ...args);
                };

                XMLHttpRequest.prototype.send = function (...args) {
                    if (assetsReady) {
                        return originalSend.apply(this, args);
                    }
                    const xhr = this;
                    const waitForAssets = window.setInterval(() => {
                        if (assetsReady) {
                            window.clearInterval(waitForAssets);
                            originalSend.apply(xhr, args);
                        }
                    }, 50);
                };
            }

            async function startGame() {
                try {
                    window.config = {
                        loader: "unity",
                        debug: false,
                        maxRatio: 16 / 9,
                        minRatio: 9 / 16,
                        title: "Subway Surfers: Beijing",
                        unityVersion: "2019.2.0f1",
                        unityWebglBuildUrl: "Beijing_2.json",
                        fileSize: 36,
                        cachedDecompressedFileSizes: {
                            "Beijing_2.asm.code.unityweb": 9059136,
                            "Beijing_2.asm.framework.unityweb": 89457,
                            "Beijing_2.asm.memory.unityweb": 1007260,
                            "Beijing_2.data.unityweb": 19343219,
                            "Beijing_2.wasm.code.unityweb": 7338464,
                            "Beijing_2.wasm.framework.unityweb": 93787
                        }
                    };
                    installAssetInterceptors();

                    await Promise.all([
                        mergeSplitFile("Beijing_2.data.unityweb", 2),
                        mergeSplitFile("Beijing_2.wasm.code.unityweb", 2)
                    ]);
                    assetsReady = true;

                    await loadScript("4399.js");
                    await loadScript("master-loader.js");
                } catch (error) {
                    console.error("Could not start Subway Surfers: Beijing:", error);
                    showError(`Subway Surfers: Beijing could not load: ${error.message}`);
                }
            }

            startGame();
        })();
    </script>
</body>
</html>
